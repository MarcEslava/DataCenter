<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecoceutics · DataHub</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('Luminous_Connected_N_de_Network_Design.png') center center / cover no-repeat;
            font-family: "Inter", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #333;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            max-width: 450px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #555;
        }
        p {
            font-size: 16px;
            color: #555;
            margin-bottom: 24px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        a.button {
            display: inline-block;
            padding: 14px 24px;
            background: #E17262;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: 0.2s;
        }
        a.button:hover {
            background: #E17262;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Ecoceutics · DataHub</h1>
        <p>Accede a las interfaces de Airflow, Spark y Kafka UI.</p>

        <div class="links">
            <a class="button" href="/airflow">Ir a Airflow</a>
            <a class="button" href="/spark">Ir a Spark</a>
            <a class="button" href="/kafka">Ir a Kafka UI</a>
        </div>

        <div class="footer">© 2026 Ecoceutics — Plataforma DataHub</div>
    </div>
</body>
</html>
