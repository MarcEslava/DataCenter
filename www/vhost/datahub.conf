<VirtualHost *:80>
    ServerName ${DATAHUB_MAIN_DOMAIN}
    Redirect / https://${DATAHUB_MAIN_DOMAIN}/
</VirtualHost>

<VirtualHost *:443>
    ServerName ${DATAHUB_MAIN_DOMAIN}

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/${DATAHUB_MAIN_DOMAIN}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/${DATAHUB_MAIN_DOMAIN}/privkey.pem

    DocumentRoot ${DATAHUB_DOCUMENT_ROOT}
    DirectoryIndex index.html

    <Directory ${DATAHUB_DOCUMENT_ROOT}>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Redirect /airflow https://${DATAHUB_AIRFLOW_DOMAIN}/
    Redirect /spark https://${DATAHUB_SPARK_DOMAIN}/
    Redirect /kafka https://${DATAHUB_KAFKA_DOMAIN}/

</VirtualHost>
