<VirtualHost *:80>
    ServerName ${DATAHUB_KAFKA_DOMAIN}
    Redirect / https://${DATAHUB_KAFKA_DOMAIN}/
</VirtualHost>

<VirtualHost *:443>
    ServerName ${DATAHUB_KAFKA_DOMAIN}

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/${DATAHUB_KAFKA_DOMAIN}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/${DATAHUB_KAFKA_DOMAIN}/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    SSLProxyEngine On
    ProxyTimeout 300

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:9021/$1 [P,L]

    ProxyPass / http://127.0.0.1:9021/
    ProxyPassReverse / http://127.0.0.1:9021/

</VirtualHost>
