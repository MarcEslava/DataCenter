<VirtualHost *:80>
    ServerName ${DATAHUB_SPARK_DOMAIN}
    Redirect / https://${DATAHUB_SPARK_DOMAIN}/
</VirtualHost>

<VirtualHost *:443>
    ServerName ${DATAHUB_SPARK_DOMAIN}

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/${DATAHUB_SPARK_DOMAIN}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/${DATAHUB_SPARK_DOMAIN}/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    SSLProxyEngine On
    ProxyTimeout 300

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    <Location "/">
        AuthType Basic
        AuthName "Restricted Area"
        AuthBasicProvider file
        AuthUserFile ${DATAHUB_AUTH_USER_FILE}
        Require valid-user
    </Location>

    ProxyPass / http://127.0.0.1:9090/
    ProxyPassReverse / http://127.0.0.1:9090/

</VirtualHost>
