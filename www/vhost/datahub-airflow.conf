<VirtualHost *:80>
    ServerName ${DATAHUB_AIRFLOW_DOMAIN}
    Redirect / https://${DATAHUB_AIRFLOW_DOMAIN}/
</VirtualHost>

<VirtualHost *:443>
    ServerName ${DATAHUB_AIRFLOW_DOMAIN}

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/${DATAHUB_AIRFLOW_DOMAIN}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/${DATAHUB_AIRFLOW_DOMAIN}/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    SSLProxyEngine On
    ProxyTimeout 300

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

</VirtualHost>
