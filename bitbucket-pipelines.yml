image: atlassian/default-image:3

pipelines:
  branches:
    main:
      - step:
          name: Call remote hook (Deploy to Production)
          deployment: Production
          script:
            - chmod +x ./call_remote_hook_deploy.sh
            - ./call_remote_hook_deploy.sh --url "$HOOK_DEPLOY_URL" --hook "$HOOK_DEPLOY_NAME" --secret "$HOOK_DEPLOY_SECRET"