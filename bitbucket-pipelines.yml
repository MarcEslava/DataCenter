# =============================================================================
# Bitbucket Pipelines CI/CD for EcoPipeline
# =============================================================================
# Auto-deploy:  push to develop -> DAGs-only to TEST
# Manual:       push to main    -> DAGs-only to PROD (requires manual trigger)
# Custom:       full-stack deploy to TEST or PROD (manual trigger)
# =============================================================================

image: atlassian/default-image:4

definitions:
  yaml-anchors:
    - &setup-ssh |
        mkdir -p ~/.ssh
        echo "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
        (umask 077; echo "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/deploy_key)
        eval $(ssh-agent -s)
        ssh-add ~/.ssh/deploy_key

    - &rsync-exclude-list
      --exclude='.git/'
      --exclude='.env'
      --exclude='secrets/'
      --exclude='__pycache__/'
      --exclude='*.pyc'
      --exclude='output/'
      --exclude='data/'
      --exclude='tests/'
      --exclude='Include/'
      --exclude='Lib/'
      --exclude='Scripts/'
      --exclude='pyvenv.cfg'
      --exclude='nul'
      --exclude='.claude/'

  steps:
    - step: &lint
        name: "Lint & Validate"
        script:
          - pip install --quiet flake8
          - flake8 dags/ --max-line-length=120 --ignore=E501,W503,E402 --exit-zero
          - python -m py_compile dags/ecoVital_ETL.py

    - step: &deploy-dags-test
        name: "Deploy DAGs to TEST"
        deployment: test
        script:
          - *setup-ssh
          - rsync -avz --delete
              -e "ssh -i ~/.ssh/deploy_key"
              dags/
              ${DEPLOY_USER}@${DEPLOY_SERVER_IP}:${DEPLOY_TEST_PATH}/dags/
          - ssh -i ~/.ssh/deploy_key
              ${DEPLOY_USER}@${DEPLOY_SERVER_IP}
              "cd ${DEPLOY_TEST_PATH} && bash setup.sh dags-only"

    - step: &deploy-dags-prod
        name: "Deploy DAGs to PROD"
        deployment: production
        trigger: manual
        script:
          - *setup-ssh
          - rsync -avz --delete
              -e "ssh -i ~/.ssh/deploy_key"
              dags/
              ${DEPLOY_USER}@${DEPLOY_SERVER_IP}:${DEPLOY_PROD_PATH}/dags/
          - ssh -i ~/.ssh/deploy_key
              ${DEPLOY_USER}@${DEPLOY_SERVER_IP}
              "cd ${DEPLOY_PROD_PATH} && bash setup.sh dags-only"

    - step: &deploy-full-test
        name: "Full Stack Deploy to TEST"
        deployment: test
        trigger: manual
        max-time: 30
        script:
          - *setup-ssh
          - rsync -avz --delete
              --exclude='.git/'
              --exclude='.env'
              --exclude='secrets/'
              --exclude='__pycache__/'
              --exclude='*.pyc'
              --exclude='output/'
              --exclude='data/'
              --exclude='tests/'
              --exclude='.claude/'
              -e "ssh -i ~/.ssh/deploy_key"
              ./
              ${DEPLOY_USER}@${DEPLOY_SERVER_IP}:${DEPLOY_TEST_PATH}/
          - ssh -i ~/.ssh/deploy_key
              ${DEPLOY_USER}@${DEPLOY_SERVER_IP}
              "cd ${DEPLOY_TEST_PATH} && bash setup.sh full-stack"

    - step: &deploy-full-prod
        name: "Full Stack Deploy to PROD"
        deployment: production
        trigger: manual
        max-time: 30
        script:
          - *setup-ssh
          - rsync -avz --delete
              --exclude='.git/'
              --exclude='.env'
              --exclude='secrets/'
              --exclude='__pycache__/'
              --exclude='*.pyc'
              --exclude='output/'
              --exclude='data/'
              --exclude='tests/'
              --exclude='.claude/'
              -e "ssh -i ~/.ssh/deploy_key"
              ./
              ${DEPLOY_USER}@${DEPLOY_SERVER_IP}:${DEPLOY_PROD_PATH}/
          - ssh -i ~/.ssh/deploy_key
              ${DEPLOY_USER}@${DEPLOY_SERVER_IP}
              "cd ${DEPLOY_PROD_PATH} && bash setup.sh full-stack"

pipelines:
  branches:
    develop:
      - step: *lint
      - step: *deploy-dags-test

    main:
      - step: *lint
      - step: *deploy-dags-prod

  custom:
    full-stack-test:
      - step: *lint
      - step: *deploy-full-test

    full-stack-prod:
      - step: *lint
      - step: *deploy-full-prod

    dags-test:
      - step: *lint
      - step: *deploy-dags-test

    dags-prod:
      - step: *lint
      - step: *deploy-dags-prod
