ServerName datahub.local
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule alias_module modules/mod_alias.so

ErrorLog /dev/stderr
LogLevel warn

<VirtualHost *:80>
  ServerName datahub.local
  ProxyRequests Off
  ProxyPreserveHost On
  ProxyTimeout 300
  RewriteEngine On

  # Root -> Airflow
  RedirectMatch 302 ^/$ /airflow/

  # -------- Airflow --------
  # Airflow's React frontend uses base href="/" so we need to proxy all its paths
  ProxyPass        /static/ http://apiserver:8080/static/
  ProxyPassReverse /static/ http://apiserver:8080/static/
  ProxyPass        /ui/ http://apiserver:8080/ui/
  ProxyPassReverse /ui/ http://apiserver:8080/ui/
  ProxyPass        /api/ http://apiserver:8080/api/
  ProxyPassReverse /api/ http://apiserver:8080/api/
  ProxyPass        /auth/ http://apiserver:8080/auth/
  ProxyPassReverse /auth/ http://apiserver:8080/auth/

  ProxyPass        /airflow/ http://apiserver:8080/
  ProxyPassReverse /airflow/ http://apiserver:8080/
  <Location "/airflow/">
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Prefix "/airflow"
  </Location>

  # -------- Control Center (strip /kafka/ prefix) --------
  RewriteRule ^/kafka/(.*)$ http://control-center:9021/$1 [P,L]
  ProxyPassReverse /kafka/ http://control-center:9021/
  # Control Center's static assets and APIs
  ProxyPass        /dist/ http://control-center:9021/dist/
  ProxyPassReverse /dist/ http://control-center:9021/dist/
  ProxyPass        /2.0/ http://control-center:9021/2.0/
  ProxyPassReverse /2.0/ http://control-center:9021/2.0/
  ProxyPass        /3.0/ http://control-center:9021/3.0/
  ProxyPassReverse /3.0/ http://control-center:9021/3.0/

  # -------- Spark --------
  ProxyPass        /spark/ http://spark-master:8080/
  ProxyPassReverse /spark/ http://spark-master:8080/

  # -------- Connect API --------
  ProxyPass        /connect/ http://connect:8083/
  ProxyPassReverse /connect/ http://connect:8083/

  # -------- Schema Registry API --------
  ProxyPass        /schema-registry/ http://schema-registry:8081/
  ProxyPassReverse /schema-registry/ http://schema-registry:8081/

</VirtualHost>
