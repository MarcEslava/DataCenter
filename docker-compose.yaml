
x-common: &common
  restart: unless-stopped
  networks: [confluent]

x-healthcheck: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 5

x-deploy-small: &deploy-small
  resources:
    limits: { cpus: '1', memory: 1G }
    reservations: { cpus: '0.25', memory: 512M }
    

x-deploy-medium: &deploy-medium
  resources:
    limits: { cpus: '2', memory: 4G }
    reservations: { cpus: '0.5', memory: 1G }

x-airflow-common: &airflow-common
  <<: *common
  image: apache/airflow:3.0.1
  environment: &airflow-common-env
    _PIP_ADDITIONAL_REQUIREMENTS: "apache-airflow-providers-microsoft-mssql pymssql"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_URL}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-this_is_a_very_secured_key_change_in_production}
    AIRFLOW__CORE__INTERNAL_API_SECRET_KEY: ${AIRFLOW_INTERNAL_API_SECRET_KEY:-NOmmb1RlQ6e+rFHGLPzgng==}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-OXdEIRar9V1kjsXKMv4v63_37n3uUsHHaOyvw0xtqLs=}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-tcDqV0CAB6yubbpSpxjdIA==}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-jpI3a/LHtBgnJZ8KUx90zg==}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__HOSTNAME_CALLABLE: "socket.getfqdn"
    AIRFLOW__LOGGING__LOGGING_LEVEL: ERROR
    AIRFLOW__WEBSERVER__LOG_FETCH_TIMEOUT_SEC: "15"
    AIRFLOW__WEBSERVER__BASE_URL: http://datahub.local/airflow
    FORWARDED_ALLOW_IPS: "*"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./setup_airflow_connections.py:/opt/airflow/setup_airflow_connections.py:ro
    - ./.env:/opt/airflow/.env:ro
  depends_on:
    - postgres

services:
  zookeeper:
    <<: *common
    image: confluentinc/cp-zookeeper:7.4.0
    ports: ["2181:2181"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_AUTH_PROVIDER_SASL: org.apache.zookeeper.server.auth.SASLAuthenticationProvider
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/zookeeper_jaas.conf"
      ZOOKEEPER_ALLOW_SASL_ANONYMOUS: "false"
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: ERROR
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
      - ./secrets/kafka:/etc/kafka
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181"]
    deploy: *deploy-small

  broker:
    <<: *common
    image: confluentinc/cp-server:7.4.0
    depends_on:
      zookeeper: { condition: service_healthy }
    ports: ["9092:9092", "9101:9101"]
    deploy: *deploy-medium
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_SSL_KEYSTORE_FILENAME: server.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: server.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_creds
      KAFKA_SSL_CLIENT_AUTH: required        # set 'required' if you want mTLS
      KAFKA_LISTENER_NAME_EXTERNAL_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_JMX_PORT: 9101
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      CONFLUENT_METRICS_ENABLE: "false"
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker:29092
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: "1"   # single-broker cluster
      CONFLUENT_METRICS_REPORTER_TOPIC_CREATE: "true"  # auto-create _confluent-metrics
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,EXTERNAL://kafka.ecoceutics.com:9092
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/jaas.conf -Dzookeeper.sasl.client=true -Dzookeeper.sasl.client.username=kafka"
      CONFLUENT_CRUISE_CONTROL_ENABLE: "false"
      CONFLUENT_TELEMETRY_ENABLED: "false"
      KAFKA_LOG4J_ROOT_LOGLEVEL: FATAL
      KAFKA_LOG4J_LOGGERS: "kafka.coordinator.group=FATAL,kafka.server.ZkAdminManager=FATAL,kafka.controller=FATAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./secrets/kafka:/etc/kafka/secrets
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "bash", "-lc", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      retries: 12
      start_period: 30s

  schema-registry:
    <<: *common
    image: confluentinc/cp-schema-registry:7.4.0
    depends_on:
      broker: { condition: service_healthy }
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_MASTER_ELIGIBILITY: "true"
      SCHEMA_REGISTRY_KAFKASTORE_INIT_TIMEOUT_MS: 120000
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: ERROR
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      retries: 10
      start_period: 60s
    deploy: *deploy-small

  control-center:
    <<: *common
    image: confluentinc/cp-enterprise-control-center:7.4.0
    depends_on:
      broker: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
    ports: ["9021:9021"]
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: broker:29092
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_CONNECT_connect-default_CLUSTER: http://connect:8083
      CONTROL_CENTER_INTERNAL_TOPICS_REPLICATION: 1
      CONTROL_CENTER_COMMAND_TOPIC_REPLICATION: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_REPLICATION: 1
      CONTROL_CENTER_METRICS_TOPIC_REPLICATION: 1
      CONTROL_CENTER_LOG4J_ROOT_LOGLEVEL: ERROR
      CONFLUENT_TELEMETRY_ENABLED: "false"
    deploy: *deploy-medium
  connect:
    <<: *common
    image: confluentinc/cp-kafka-connect:7.4.0
    depends_on:
      broker: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
    ports: ["8083:8083"]
    deploy: *deploy-small
    environment:
      CONNECT_BOOTSTRAP_SERVERS: broker:29092
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_LISTENERS: http://0.0.0.0:8083
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_ADVERTISED_PORT: "8083"
      CONNECT_PLUGIN_PATH: /usr/share/java,/etc/kafka-connect/jars
      CONNECT_LOG4J_ROOT_LOGLEVEL: ERROR
    volumes:
      - ./kafka-connect:/etc/kafka-connect/jars
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8083/connectors"]
      retries: 10

  postgres:
    <<: *common
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
    deploy: *deploy-medium

  apiserver:
    <<: *airflow-common
    command: bash -lc "exec airflow api-server"
    depends_on:
      postgres: { condition: service_started }
      scheduler: { condition: service_started }
      dag-processor: { condition: service_started }
    environment:
      <<: *airflow-common-env
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.fab_auth
    deploy: *deploy-medium
    volumes:
      - ./dags:/opt/airflow/dags
      - ./conf/airflow.cfg:/airflow.cfg
      - ./setup_airflow_connections.py:/opt/airflow/setup_airflow_connections.py:ro
      - ./.env:/opt/airflow/.env:ro
    ports: ["8080:8080"]
  reverse-proxy:
    image: httpd:2.4-alpine
    profiles: ["dev"]
    ports: ["8088:80", "443:443"]
    volumes:
      - ./conf/httpd_conf/httpd.conf:/usr/local/apache2/conf/httpd.conf
    networks: [confluent]

  scheduler:
    <<: *airflow-common
    command: bash -lc "exec airflow scheduler"
    hostname: scheduler
    environment:
      <<: *airflow-common-env
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://apiserver:8080/execution/
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    deploy: *deploy-medium

  dag-processor:
    <<: *airflow-common
    command: bash -lc "exec airflow dag-processor"
    hostname: dag-processor
    environment:
      <<: *airflow-common-env
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://apiserver:8080/execution/
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    deploy:
      resources:
        limits: { cpus: '1', memory: 1G }
        reservations: { cpus: '0.25', memory: 256M }

  spark-master:
    <<: *common
    image: apache/spark:4.0.1-scala2.13-java21-python3-r-ubuntu
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_MASTER_OPTS: "-Dspark.ui.reverseProxy=true -Dspark.ui.reverseProxyUrl=${SPARK_UI_REVERSE_PROXY_URL:-http://datahub.local/spark}"
      SPARK_PUBLIC_DNS: ${SPARK_PUBLIC_DNS:-datahub.local}
      SPARK_NO_DAEMONIZE: "true"
      SPARK_LOG_LEVEL: ERROR
    ports: ["9090:8080", "7077:7077"]
    deploy: *deploy-medium

  spark-worker:
    <<: *common
    image: apache/spark:4.0.1-scala2.13-java21-python3-r-ubuntu
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      spark-master: { condition: service_started }
    environment:
      SPARK_MODE: worker
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_OPTS: "-Dspark.ui.reverseProxy=true -Dspark.ui.reverseProxyUrl=${SPARK_UI_REVERSE_PROXY_URL:-http://datahub.local/spark}"
      SPARK_WORKER_HOST: spark-worker
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_LOG_LEVEL: ERROR
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G }
        reservations: { cpus: '0.5', memory: 512M }
  
  python-master:
    image: python:3.11.2-slim
    restart: unless-stopped
    working_dir: /work/projects
    tty: true
    stdin_open: true
    deploy: *deploy-medium
    command: sleep infinity
    networks: [confluent]
    environment:
      GIT_SSH_COMMAND: "ssh -o StrictModes=no"
    volumes:
      - .:/work/projects
      - ~/.ssh:/root/.ssh:ro

  mongo:
    <<: *common
    image: mongo:7
    profiles: ["dev"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  spark_checkpoint:
  mongo_data:

networks:
  confluent:
