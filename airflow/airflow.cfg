<VirtualHost *:443>
  ServerName datahub.ecoceutics.com

  SSLEngine on
  SSLCertificateFile      /etc/ssl/certs/airflow.fullchain.pem
  SSLCertificateKeyFile   /etc/ssl/private/airflow.privkey.pem

  # Optional hardening
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

  # If someone hits the bare root, send them to the prefix
  RedirectMatch 302 ^/$ /airflow/

  # ----- Airflow behind /airflow/ -----
  # IMPORTANT: trailing slashes on both sides
  ProxyPass        /airflow/ http://apiserver:8080/
  ProxyPassReverse /airflow/ http://apiserver:8080/

  # Forward client/proto/host/port to Airflow
  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Host  "datahub.ecoceutics.com"
  RequestHeader set X-Forwarded-Port  "443"
  RequestHeader set X-Forwarded-Prefix "/airflow"

  # WebSocket upgrade (logs/stream)
  RewriteEngine On
  RewriteCond %{HTTP:Upgrade} =websocket [NC]
  RewriteRule /airflow/(.*)  ws://apiserver:8080/$1 [P,L]

  # For non-websocket requests keep HTTP/1.1 & upgrade headers
  ProxyRequests off
  ProxyPreserveHost On
  RequestHeader set Upgrade %{Upgrade}e env=Upgrade
  RequestHeader set Connection "upgrade"

  # Timeouts generous for long ops
  ProxyTimeout 600
  ProxyBadHeader Ignore

  # Optional if you serve URLs with encoded slashes
  AllowEncodedSlashes NoDecode
</VirtualHost>

# Redirect HTTP -> HTTPS
<VirtualHost *:80>
  ServerName datahub.ecoceutics.com
  Redirect permanent / https://datahub.ecoceutics.com/
</VirtualHost>
